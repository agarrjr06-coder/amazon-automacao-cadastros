name: Testes Python
on:
  push:
  pull_request:
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependências de testes
        run: python -m pip install openpyxl==3.1.5
      - name: Executar testes
        run: python -m unittest discover -s testes -v
